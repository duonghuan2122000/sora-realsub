[package]
name = "translate-sidecar"
version = "0.1.0"
edition = "2024"
description = "CLI dịch local (NLLB-200 qua CTranslate2), chạy độc lập khỏi app chính để tránh xung đột CRT native với ort (xem wiki PBI-16-dich-local-sidecar)"

[[bin]]
name = "translate-sidecar"
path = "src/main.rs"

[dependencies]
# Model Marian-MT (opus-mt-en-vi, Apache-2.0) dùng source.spm/target.spm → cần feature
# "sentencepiece". PHẢI build với RUSTFLAGS="-C target-feature=+crt-static" (xem README/wiki
# PBI-16) để tránh xung đột CRT nội bộ giữa sentencepiece-sys (/MD mặc định) và ct2rs-sys (/MT).
ct2rs = { version = "0.11", default-features = false, features = ["sentencepiece", "ruy"] }

[profile.release]
opt-level = 3
